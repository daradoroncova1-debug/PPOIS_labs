name: Lab 1 CI/CD

permissions:
  contents: write

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
    paths:
      - "1lab/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - "1lab/**"
      - ".github/workflows/ci.yml"

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lab: 1lab
            sub:  rubik
            path: 1lab/rubik
            test_binary: rubik_tests
            app_binary:  rubik_app
          - lab: 1lab
            sub:  post
            path: 1lab/post
            test_binary: post_tests
            app_binary:  post_app
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck catch2 doxygen
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
        working-directory: ${{ matrix.path }}
      - name: Build
        run: cmake --build build
        working-directory: ${{ matrix.path }}
      - name: Run tests
        run: ./build/${{ matrix.test_binary }}
        working-directory: ${{ matrix.path }}
      - name: Coverage
        run: gcovr -r . --fail-under-line 90 --exclude tests/ --exclude '.*main\.cpp' --object-directory build
        working-directory: ${{ matrix.path }}
      - name: Static analysis
        run: cppcheck --enable=warning,style --error-exitcode=1 src/
        working-directory: ${{ matrix.path }}
      - name: Doxygen
        # doxygen создаёт только один недостающий уровень каталога,
        # а docs/ на чистом клоне отсутствует (вывод игнорируется git),
        # поэтому каталог создаём заранее.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs/${{ matrix.lab }}/${{ matrix.sub }}"
          doxygen Doxyfile
        working-directory: ${{ matrix.path }}
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-${{ matrix.sub }}-docs
          # Doxyfile пишет вывод в docs/<lab>/<sub>/html (путь от корня репозитория)
          path: docs/${{ matrix.lab }}/${{ matrix.sub }}/html/
      - name: Package Application
        working-directory: ${{ matrix.path }}   # <--- ДОБАВЛЕНА ЭТА СТРОКА
        run: |
          mkdir -p release_artifacts
          
          BIN_PATH=$(find build -type f -name "${{ matrix.app_binary }}" -executable | head -n 1)
          
          if [ -z "$BIN_PATH" ]; then
            echo "ОШИБКА: Не удалось найти бинарник ${{ matrix.app_binary }} в папке build/"
            exit 1
          fi
          
          echo "Найден бинарник по пути: $BIN_PATH"
          cp "$BIN_PATH" release_artifacts/
          
          ldd "$BIN_PATH" | grep "=> /" | awk '{print $3}' | xargs -I '{}' cp -v '{}' release_artifacts/ || true
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION=${{ github.sha }}
          fi
          
          tar -czvf ${{ matrix.sub }}_app-${VERSION}.tar.gz -C release_artifacts .
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/') 
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.tar.gz"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}